pnmatrix:
  values: [f, u, t]
  distinguished_sets:
    - [u, t]
  interpretation:
    p or q:
      restrictions:
        - [_,_]: [t]
        - [u,_]: [u]
        - [_,u]: [u]
        - [f,f]: [f]
    p and q:
      restrictions:
        - [_,_]: [f]
        - [u,_]: [u]
        - [_,u]: [u]
        - [t,t]: [t]
    p -> q:
      default: [t]
      restrictions:
        - [u,_]: [u]
        - [_,u]: [u]
        - [t,f]: [f]
    neg p:
      restrictions:
        - [t]: [f]
        - [u]: [u]
        - [f]: [t]
simplify_overlap: true
simplify_dilution: true
simplify_by_cuts: true
simplify_derivation: 50
simplify_subrules_deriv: 100
discriminator:
  t: [[p],[neg p]]
  u: [[p, neg p],[]]
  f: [[],[p]]
derive:
  comm_and: [[p and q],[q and p]]
latex:
  p1: "\\varphi"
  p2: "\\psi"
  and: "\\land"
  or: "\\lor"
  ->: "\\to"
  neg: "\\neg"
  t: "\\mathtt{t}"
  u: "\\mathtt{u}"
  f: "\\mathtt{f}"
