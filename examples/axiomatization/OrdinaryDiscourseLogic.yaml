    sqor(p,q):
      restrictions:
        - [f, _]: [f]
        - [t, _]: [t]
        - [g, _]: [g]
        - [g, t]: [t]
    p or q:
      restrictions:
        - [f,f]: [f]
        - [f,g]: [f]
        - [g,f]: [f]
        - [t,_]: [t]
        - [_,t]: [t]
        - [g,g]: [g]
          #p and q:
          #  restrictions:
          #    - [t,t]: [t]
