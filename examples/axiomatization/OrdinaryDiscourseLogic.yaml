          #    - [g,t]: [t]
          #    - [f,_]: [f]
          #    - [_,f]: [f]
          #    - [g,g]: [g]
    neg p:
      restrictions:
        - [g]: [g]
        - [t]: [f]
        - [f]: [t]
simplify_overlap: true
simplify_dilution: true
simplify_by_cuts: true
simplify_derivation: 100
simplify_subrules_deriv: 100
discriminator:
  g: [[p, neg p], []]
  t: [[p], [neg p]]
  f: [[], [p]]
latex:
  p: "\\varphi"
  p1: "\\varphi"
  p2: "\\psi"
  and: "\\land"
  or: "\\lor"
  ->: "\\to"
  neg: "\\neg"
  t: "\\mathtt{t}"
  u: "\\mathtt{u}"
  g: "\\mathtt{g}"
  f: "\\mathtt{f}"
  biimp: "\\Leftrightarrow"
  dimp: "\\Rightarrow"
